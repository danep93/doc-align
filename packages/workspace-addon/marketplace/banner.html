<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:220px; height:140px; overflow:hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a73e8 0%, #174ea6 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .icon { width:48px; height:48px; border-radius:10px;
    background: conic-gradient(#4285f4 0turn .25turn, #34a853 .25turn .5turn, #fbbc05 .5turn .75turn, #ea4335 .75turn 1turn);
    display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .icon-inner { width:34px; height:34px; border-radius:7px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .icon-inner svg { width:20px; height:20px; }
  .name { color:#fff; font-size:20px; font-weight:600; letter-spacing:.01em; }
  .tag { color:#d2e3fc; font-size:10px; }
</style>
</head>
<body>
  <div class="icon"><div class="icon-inner">
    <svg viewBox="0 0 24 24"><path fill="#1a73e8" d="M7 12.5l3 3 6-6.5" stroke="#1a73e8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div></div>
  <div class="name">doc-align</div>
  <div class="tag">Sign-off &amp; alignment for Docs</div>
</body>
</html>
